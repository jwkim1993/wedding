    <script>
        function initMap() {
            var map = new naver.maps.Map('map', {
                center: new naver.maps.LatLng(37.4015140, 126.9513167),
                zoom: 16
            });

            var marker = new naver.maps.Marker({
                position: new naver.maps.LatLng(37.4015140, 126.9513167),
                map: map,
                title: '빌라드지디 안양'
            });

            // Secondary car map (if present)
            function initSingleCarMap(id, defLat, defLng, defTitle) {
                var el = document.getElementById(id);
                if (!el) return;
                var lat = parseFloat(el.getAttribute('data-lat')) || defLat;
                var lng = parseFloat(el.getAttribute('data-lng')) || defLng;
                var title = el.getAttribute('data-title') || defTitle;
                var instance = new naver.maps.Map(id, {
                    center: new naver.maps.LatLng(lat, lng),
                    zoom: 16
                });
                new naver.maps.Marker({
                    position: new naver.maps.LatLng(lat, lng),
                    map: instance,
                    title: title
                });
            }
            initSingleCarMap('map-car', 37.402000, 126.952000, '빌라드지디 안양(주차/대기)');
            initSingleCarMap('map-car-2', 37.401400, 126.952500, '주차장 B');
            initSingleCarMap('map-car-3', 37.401900, 126.951800, '픽업/하차 지점');
        }

        if (typeof naver !== 'undefined') {
            initMap();
        } else {
            window.addEventListener('load', initMap);
        }

        // Countdown Timer
        function updateCountdown() {
            const weddingDate = new Date('2025-10-26T12:50:00');
            const now = new Date();
            const timeDiff = weddingDate - now;

            if (timeDiff > 0) {
                const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);

                document.getElementById('days').textContent = days;
                document.getElementById('hours').textContent = hours;
                document.getElementById('minutes').textContent = minutes;
                document.getElementById('seconds').textContent = seconds;
            } else {
                document.getElementById('days').textContent = '0';
                document.getElementById('hours').textContent = '0';
                document.getElementById('minutes').textContent = '0';
                document.getElementById('seconds').textContent = '0';
            }
        }

        // Update countdown every second
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Copy account function
        function copyAccount(accountNumber, holderName) {
            const textToCopy = `${accountNumber} ${holderName}`;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showCopySuccess();
                }).catch(() => {
                    fallbackCopy(textToCopy);
                });
            } else {
                fallbackCopy(textToCopy);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                document.execCommand('copy');
                showCopySuccess();
            } catch (err) {
                console.error('복사 실패:', err);
                alert('복사에 실패했습니다. 수동으로 복사해주세요.');
            }

            document.body.removeChild(textArea);
        }

        function showCopySuccess() {
            // Create toast notification
            const toast = document.createElement('div');
            toast.textContent = '계좌번호가 복사되었습니다!';
            toast.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: #333;
                color: white;
                padding: 10px 16px;
                border-radius: 6px;
                font-size: 14px;
                z-index: 1000;
                animation: fadeInOut 2s ease-in-out;
                white-space: nowrap;          /* 한 줄 유지 */
                word-break: keep-all;         /* 한국어 줄바꿈 방지 */
                max-width: 92vw;              /* 작은 화면에서도 안전 */
                overflow: hidden;             /* 혹시 넘치면 숨김 */
                text-overflow: clip;          /* 말줄임 없이 잘림 방지 */
            `;

            document.body.appendChild(toast);

            setTimeout(() => {
                document.body.removeChild(toast);
            }, 2000);
        }

        // Toggle account list function
        function toggleAccountList(type) {
            const list = document.getElementById(type + '-list');
            const icon = document.getElementById(type + '-icon');
            // 강제 리플로우로 애니메이션/레이아웃 지연 방지
            list.style.willChange = 'max-height';

            // 자연스러운 높이 전환을 위해 계산된 높이 사용
            const expandedHeight = list.scrollHeight + 'px';
            if (list.classList.contains('collapsed')) {
                list.classList.remove('collapsed');
                list.style.height = expandedHeight;
                icon.classList.remove('rotated');
                list.setAttribute('aria-hidden', 'false');
            } else {
                list.style.height = list.scrollHeight + 'px';
                // 다음 프레임에서 0으로 줄여 애니메이션 유도
                requestAnimationFrame(() => { list.style.height = '0px'; });
                list.classList.add('collapsed');
                icon.classList.add('rotated');
                list.setAttribute('aria-hidden', 'true');
            }
            // 열고 닫기 후 will-change 해제
            setTimeout(() => { list.style.willChange = 'auto'; }, 200);
            if (window.__updateExtraHeight) {
                // 토글 애니메이션이 끝난 직후 한 번 더 보정
                setTimeout(window.__updateExtraHeight, 260);
            }
        }


        // Add CSS animation for toast
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInOut {
                0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
                20%, 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
                100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            }
            /* 더블탭 확대 방지 */
            body { touch-action: manipulation; }
        `;
        document.head.appendChild(style);

        // Gallery Modal Logic
        (function initGalleryModal() {
            const galleryImages = Array.from(document.querySelectorAll('.gallery .photo-item img'));
            if (galleryImages.length === 0) return;

            const modal = document.getElementById('photo-modal');
            const modalImg = modal.querySelector('.modal-image');
            const closeBtn = modal.querySelector('.modal-close');
            const prevBtn = modal.querySelector('.modal-prev');
            const nextBtn = modal.querySelector('.modal-next');
            let currentIndex = 0;

            function openModal(index) {
                currentIndex = index;
                const { src, alt } = galleryImages[currentIndex];
                modalImg.src = src;
                modalImg.alt = alt || '갤러리 이미지';
                modal.classList.add('open');
                modal.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }

            function closeModal() {
                modal.classList.remove('open');
                modal.setAttribute('aria-hidden', 'true');
                modalImg.src = '';
                document.body.style.overflow = '';
            }

            function showAdjacent(delta) {
                const total = galleryImages.length;
                currentIndex = (currentIndex + delta + total) % total;
                const { src, alt } = galleryImages[currentIndex];
                modalImg.src = src;
                modalImg.alt = alt || '갤러리 이미지';
            }

            galleryImages.forEach((img, index) => {
                img.style.cursor = 'zoom-in';
                img.addEventListener('click', () => openModal(index));
                img.setAttribute('tabindex', '0');
                img.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') openModal(index);
                });
            });

            closeBtn.addEventListener('click', closeModal);
            prevBtn.addEventListener('click', () => showAdjacent(-1));
            nextBtn.addEventListener('click', () => showAdjacent(1));

            // 바깥 영역 클릭 시 닫기
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            // 키보드 제어
            document.addEventListener('keydown', (e) => {
                if (!modal.classList.contains('open')) return;
                if (e.key === 'Escape') closeModal();
                if (e.key === 'ArrowLeft') showAdjacent(-1);
                if (e.key === 'ArrowRight') showAdjacent(1);
            });

            // 모바일 핀치/더블탭 줌 방지(캡처 단계, cancelable 보장)
            const cancel = (e) => { if (e.cancelable) e.preventDefault(); };
            document.addEventListener('gesturestart', cancel, { passive: false, capture: true });
            document.addEventListener('gesturechange', cancel, { passive: false, capture: true });
            document.addEventListener('gestureend', cancel, { passive: false, capture: true });
            document.addEventListener('touchmove', (e) => {
                if (e.touches && e.touches.length > 1) cancel(e);
            }, { passive: false, capture: true });
            let lastTouchEnd = 0;
            document.addEventListener('touchend', (e) => {
                const now = Date.now();
                if (now - lastTouchEnd <= 300) {
                    cancel(e);
                }
                lastTouchEnd = now;
            }, { passive: false, capture: true });
        })();

        // 배경 하단 오프셋을 동적으로 계산해 CSS 변수로 반영
        (function setBackgroundBottom() {
            const bg = document.querySelector('.bg-img');
            const root = document.documentElement;
            function apply() {
                if (!bg) return;
                // 실제 렌더링 높이 기준으로 하단 오프셋 설정
                const rect = bg.getBoundingClientRect();
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop || 0;
                const bottom = Math.round(rect.top + scrollTop + rect.height);
                root.style.setProperty('--bg-bottom', bottom + 'px');
            }
            if (bg && bg.complete) apply();
            else if (bg) bg.addEventListener('load', apply);
            window.addEventListener('resize', apply);
            window.addEventListener('orientationchange', apply);
            apply();
        })();

        // 드롭다운 확장 높이만큼 하단 배경 확장 (단일 옵저버/리스너; 누적 방지)
        (function initDynamicExtraHeight() {
            const root = document.documentElement;
            const stage = document.querySelector('.bg-stage');
            const bg = document.querySelector('.bg-img');
            const accounts = document.querySelector('.layer-accounts') || document.querySelector('.account');
            if (!stage || !bg || !accounts) return;

            function updateExtraHeight() {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop || 0;
                const bgRect = bg.getBoundingClientRect();
                const accountsRect = accounts.getBoundingClientRect();
                const bgBottom = Math.round(bgRect.top + scrollTop + bgRect.height);
                const accountsBottom = Math.round(accountsRect.top + scrollTop + accounts.scrollHeight);
                const extra = Math.max(0, accountsBottom - bgBottom);
                root.style.setProperty('--extra-height', extra + 'px');
            }

            const ro = new ResizeObserver(() => updateExtraHeight());
            ro.observe(accounts);
            window.addEventListener('resize', updateExtraHeight, { passive: true });
            window.addEventListener('orientationchange', updateExtraHeight);
            updateExtraHeight();

            // 토글 이후 높이 변경 반영 (기존 toggleAccountList에서 호출)
            window.__updateExtraHeight = updateExtraHeight;
        })();
    </script>
